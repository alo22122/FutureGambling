<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Future Community</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: white;
    }
    .glass {
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid #3f3f46;
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md">
      
      <h1 class="text-3xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
        Future Community
      </h1>
      <p class="text-center text-zinc-400 text-sm mb-6">Nur Fake-Geld • Nur zum Spaß</p>

      <!-- Status Anzeige (sehr wichtig) -->
      <div id="status" class="mb-6 p-4 rounded-xl text-center text-sm font-medium bg-zinc-800 text-zinc-300">
        Bereit. Drücke einen Button.
      </div>

      <input id="username" type="text" placeholder="Username" 
        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 mb-3 outline-none" />

      <input id="password" type="password" placeholder="Passwort" 
        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 mb-6 outline-none" />

      <div class="flex gap-3">
        <button id="loginBtn" 
          class="flex-1 bg-cyan-600 py-3.5 rounded-xl font-semibold active:bg-cyan-400">
          Einloggen
        </button>
        <button id="registerBtn" 
          class="flex-1 bg-emerald-600 py-3.5 rounded-xl font-semibold active:bg-emerald-400">
          Registrieren
        </button>
      </div>
    </div>
  </div>

  <!-- APP (erstmal versteckt) -->
  <div id="app" class="hidden min-h-screen p-6">
    <div class="max-w-lg mx-auto">
      <h2 class="text-2xl font-bold mb-4" id="welcome">Willkommen</h2>
      <div class="text-emerald-400 text-xl font-bold mb-6">
        Balance: <span id="balance">0</span> FC
      </div>
      <button onclick="logout()" class="bg-zinc-700 px-4 py-2 rounded-lg">Logout</button>
    </div>
  </div>

  <script>
    // ====================== SUPABASE ======================
    const SUPABASE_URL = 'https://gxxblyzjxsagwmgjvhyu.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4eGJseXpqeHNhZ3dtZ2p2aHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwOTQ5NjUsImV4cCI6MjExMDY3MDk2NX0.7Jktb_7QPtdmPGi-LxRutLSRca5ehdWLqX0lfkU22Ik'

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // Status anzeigen (sehr sichtbar)
    function setStatus(text, type = 'info') {
      const el = document.getElementById('status')
      el.textContent = text
      if (type === 'error') {
        el.className = 'mb-6 p-4 rounded-xl text-center text-sm font-medium bg-red-900/50 text-red-300 border border-red-700'
      } else if (type === 'success') {
        el.className = 'mb-6 p-4 rounded-xl text-center text-sm font-medium bg-emerald-900/50 text-emerald-300 border border-emerald-700'
      } else {
        el.className = 'mb-6 p-4 rounded-xl text-center text-sm font-medium bg-zinc-800 text-zinc-300'
      }
    }

    // ====================== REGISTER ======================
    document.getElementById('registerBtn').addEventListener('click', async function() {
      setStatus('Registrierung läuft...', 'info')

      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value

      if (!username || username.length < 3) {
        setStatus('Username muss mindestens 3 Zeichen haben', 'error')
        return
      }
      if (password.length < 4) {
        setStatus('Passwort muss mindestens 4 Zeichen haben', 'error')
        return
      }

      const fakeEmail = username.toLowerCase().replace(/[^a-z0-9]/g, '') + '@future.community'

      try {
        const { data, error } = await supabase.auth.signUp({
          email: fakeEmail,
          password: password,
          options: {
            data: { username: username }
          }
        })

        if (error) {
          setStatus('Fehler: ' + error.message, 'error')
        } else {
          setStatus('Account erstellt! Du kannst dich jetzt einloggen.', 'success')
        }
      } catch (err) {
        setStatus('Fehler: ' + err.message, 'error')
      }
    })

    // ====================== LOGIN ======================
    document.getElementById('loginBtn').addEventListener('click', async function() {
      setStatus('Login läuft...', 'info')

      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value

      if (!username || !password) {
        setStatus('Bitte Username und Passwort eingeben', 'error')
        return
      }

      const fakeEmail = username.toLowerCase().replace(/[^a-z0-9]/g, '') + '@future.community'

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: fakeEmail,
          password: password
        })

        if (error) {
          setStatus('Login fehlgeschlagen: ' + error.message, 'error')
        } else {
          setStatus('Login erfolgreich! Lade...', 'success')
        }
      } catch (err) {
        setStatus('Fehler: ' + err.message, 'error')
      }
    })

    // ====================== LOGOUT ======================
    async function logout() {
      await supabase.auth.signOut()
      location.reload()
    }

    // ====================== AUTH STATE ======================
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (session) {
        document.getElementById('auth-screen').classList.add('hidden')
        document.getElementById('app').classList.remove('hidden')

        // Profil laden
        const { data } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', session.user.id)
          .single()

        if (data) {
          document.getElementById('welcome').textContent = 'Hey, ' + data.username
          document.getElementById('balance').textContent = Number(data.balance).toFixed(0)
        }
      } else {
        document.getElementById('auth-screen').classList.remove('hidden')
        document.getElementById('app').classList.add('hidden')
      }
    })
  </script>
</body>
</html>
