}

    cr.timer = setInterval(crashTick, 100); return
  }

async function crashTick() {
  if (!cr) return

    cr.polling = true
    const d = await call('crash_status', {})
    if (cr) { cr.polling = false; if (d && d.state === 'crashed') crashEnd(d) }
  }
}
function crashEnd(d) {
  clearInterval(cr.timer); cr = null; setBalance(d.balance)
  const s = $('stage'), b = $('crbtn'); b.textContent = 'Start'; b.className = 'btn bg-emerald-600'

async function play(param) {

  busy = true; lastBet = bet; lastParam = param; setBtns(true); msg('')

  if (error) { msg(error.message, 'lose'); busy = false; setBtns(false); return }
  await REVEAL[current](data)
  setBalance(data.balance)

  msg(net > 0 ? `🎉 +${net} FC` : net === 0 ? 'Einsatz zurück' : `−${bet - data.payout} FC`, net > 0 ? 'win' : 'lose')
  HIST.unshift({ g: GAMES[current].icon + ' ' + GAMES[current].name, bet, net }); HIST.length = Math.min(HIST.length, 8); renderHist()
  busy = false; setBtns(false)
}

  if (!username || !password) return setStatus('Bitte Username und Passwort eingeben', 'error')
  const { error } = await sb.auth.signInWithPassword({ email: fakeEmail(username), password })
  if (error) setStatus('Login fehlgeschlagen: ' + error.message, 'error')
})

async function logout() { await sb.auth.signOut(); location.reload() }

sb.auth.onAuthStateChange((event, session) => {
  if (!session) return
  $('auth-screen').style.display = 'none'
  $('app').classList.remove('hidden')
  setTimeout(() => { if (!$('view').innerHTML) show(current); loadProfile() }, 0)
})
</script>
</body>
</html>
