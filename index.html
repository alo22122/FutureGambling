function setStatus(text, type = 'info') {
  const el = $('status'); el.textContent = text
  el.style.background = type === 'error' ? 'rgba(127,29,29,.5)' : type === 'success' ? 'rgba(6,78,59,.5)' : '#27272a'
  el.style.color = type === 'error' ? '#fca5a5' : type === 'success' ? '#6ee7b7' : '#d4d4d8'
}
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hidden'), 2600) }
function msg(t, type) { const e = $('msg'); e.textContent = t; e.style.color = type === 'win' ? '#34d399' : type === 'lose' ? '#f87171' : '#a1a1aa' }
function toggleMenu() { $('sidebar').classList.toggle('-translate-x-full') }

function setBalance(n) {
  n = Number(n) || 0
  const from = balance, t0 = performance.now(); balance = n
  ;(function step(t) {
    const k = Math.min(1, (t - t0) / 500), v = Math.round(from + (n - from) * k)
    $('balance').textContent = $('balance2').textContent = v.toLocaleString('de-DE')
    if (k < 1) requestAnimationFrame(step)
  })(t0)
}

async function loadProfile() {
  const { data, error } = await sb.rpc('get_me')
  if (error) { console.error(error); if (/gesperrt/.test(error.message)) { alert(error.message); logout() } else toast('Profil-Fehler: ' + error.message); return }
  ROLE = data.role
  ME = data; $('welcome').innerHTML = nm(data) + (data.role === 'admin' ? ' <span class="text-purple-400 font-bold text-[10px] bg-purple-900/50 px-1.5 py-0.5 rounded border border-purple-500/40">ADMIN</span>' : data.role === 'vip' ? ' <span class="text-yellow-400 font-bold text-[10px] bg-yellow-900/50 px-1.5 py-0.5 rounded border border-yellow-500/40">VIP</span>' : '')
  if (!hb) hb = setInterval(() => sb.rpc('heartbeat'), 60000)
  setBalance(data.balance); renderNav()
  checkAnnouncement()
}

async function checkAnnouncement() {
  const { data } = await sb.rpc('get_announcement')

async function crashBtn() {

  if (!cr) {

    sfx.bet()
    b.disabled = true
    const d = await call('crash_start', { b: bet }); b.disabled = false; if (!d) return
    lastBet = bet; setBalance(d.balance); msg(''); $('stage').style.color = ''
    cr = { t0: performance.now(), polling: false }
    b.textContent = '💸 CASHOUT'; b.className = 'btn bg-yellow-500 text-black'
    cr.timer = setInterval(crashTick, 100); return
  }
  b.disabled = true
  const d = await call('crash_status', { do_cash: true }); b.disabled = false
  if (d && cr) crashEnd(d)
}
async function crashTick() {
  if (!cr) return
  sfx.spin()
  const m = Math.exp(0.12 * (performance.now() - cr.t0) / 1000)
  $('stage').textContent = '🚀 ' + (Math.floor(m * 100) / 100).toFixed(2) + '×'
  if (++crPoll % 3 === 0 && !cr.polling) {
    cr.polling = true
    const d = await call('crash_status', {})
    if (cr) { cr.polling = false; if (d && d.state === 'crashed') crashEnd(d) }
  }
}
function crashEnd(d) {
  clearInterval(cr.timer); cr = null; setBalance(d.balance)
  const s = $('stage'), b = $('crbtn'); b.textContent = 'Start'; b.className = 'btn bg-emerald-600'
  if (d.state === 'cashed') {
    sfx.win()
    s.textContent = '✅ ' + Number(d.m).toFixed(2) + '×'; s.style.color = '#34d399'
    const net = d.payout - lastBet; msg(`🎉 +${net} FC (Crash bei ${Number(d.cp).toFixed(2)}×)`, 'win'); logRound(net)
  } else {
    sfx.lose()
    s.textContent = '💥 ' + Number(d.cp).toFixed(2) + '×'; s.style.color = '#f87171'
    msg(`💥 −${lastBet} FC`, 'lose'); logRound(-lastBet)
  }
}

async function towersBtn() {

async function towersPick(c) {

async function slotSpin() {
  if (busy || !slotCur) return
  const M = SLOTS[slotCur], bet = readBet(); if (!bet) return
  sfx.bet()
  busy = true; lastBet = bet; $('spinbtn').disabled = true; msg('')
  const d = await call('slot_play', { machine: slotCur, bet_amount: bet })
  if (!d) { busy = false; $('spinbtn').disabled = false; return }
  const arr = d.result.split(' ').map(Number), cells = [...document.querySelectorAll('.reel')]
  if (slotCur === 'scratch') { scr = { d, arr, done: new Set() }; cells.forEach(c => { c.textContent = '❔' }); return }
  const sp = { normal: [450, 330], fast: [160, 110], turbo: [0, 0] }[slotSpeed] || [450, 330]
  const iv = slotSpeed === 'turbo' ? [] : cells.map(c => setInterval(() => { c.textContent = M.sym[Math.floor(Math.random() * M.sym.length)]; sfx.spin() }, 70))
  for (let i = 0; i < cells.length; i++) {
    await sleep(i === 0 ? sp[0] : sp[1])
    clearInterval(iv[i]); cells[i].textContent = M.sym[arr[i] - 1]; cells[i].classList.add('stop')
    sfx.click()
  }
  slotDone(d)
}

function scratchClick(i) {
  if (!scr || scr.done.has(i)) return
  sfx.click()

function switchAdmTab(t) {
  sfx.click();
  admTab = t;
  ['games', 'server', 'players', 'economy', 'logs'].forEach(tab => {
    const btn = $('atab_' + tab);
    if (!btn) return;
    if (tab === t) {
      btn.className = 'px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition whitespace-nowrap bg-gradient-to-r from-cyan-600 to-emerald-600 text-white shadow-lg shadow-cyan-900/30';
    } else {
      btn.className = 'px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition whitespace-nowrap hover:bg-zinc-800 text-zinc-300';
    }
  });
  renderAdminContent();
}

PAGEINIT.admin = () => { loadAdminFullDashboard(); };

async function loadAdminFullDashboard() {
  const d = await call('admin_get_full_dashboard', {});
  if (!d) return;
  ADM_DATA = d;
  ADMIN_USERS_CACHE = d.users || [];
  renderAdminContent();
}

function renderAdminContent() {
  const container = $('adm_tab_content');
  if (!container || !ADM_DATA) return;

  if (admTab === 'games') renderAdminGamesTab(container);
  else if (admTab === 'server') renderAdminServerTab(container);
  else if (admTab === 'players') renderAdminPlayersTab(container);
  else if (admTab === 'economy') renderAdminEconomyTab(container);
  else if (admTab === 'logs') renderAdminLogsTab(container);
}

async function play(param) {
  if (busy) return
  const bet = Math.floor(Number($('bet').value))
  if (!(bet >= 1)) return msg('Ungültiger Einsatz', 'lose')
  if (bet > balance) return msg('Nicht genug Coins', 'lose')
  sfx.bet()
  busy = true; lastBet = bet; lastParam = param; setBtns(true); msg('')
  const { data, error } = current === 'plinko' ? await sb.rpc('play_plinko', { bet_amount: bet, risk: plinkoRisk }) : await sb.rpc(current === 'baccarat' || current === 'sicbo' ? 'play_game2' : 'play_game_d', { game_name: current, bet_amount: bet, param })
  if (error) { msg(error.message, 'lose'); sfx.lose(); busy = false; setBtns(false); return }
  if (REVEAL[current]) await REVEAL[current](data)
  setBalance(data.balance)
  const net = data.payout - bet
  if (net > 0) sfx.win(); else if (net < 0) sfx.lose(); else sfx.click()

function openDm(name) { dmWith = name; $('dmbox').innerHTML = `<div class="glass rounded-xl p-3"><div class="font-bold mb-2">💬 ${esc(name)}</div><div id="dmmsgs" class="h-56 overflow-y-auto space-y-1 mb-2 text-sm"></div><div class="flex gap-2"><input id="dmin" class="inp flex-1 min-w-0" placeholder="Nachricht..." onkeydown="if(event.key==='Enter')dmSend()"><button class="btn bg-cyan-600" style="width:auto" onclick="dmSend()">Senden</button></div></div>`; loadDm() }
async function loadDm() { const d = await call('dm_list', { with_user: dmWith }), b = $('dmmsgs'); if (!d || !b) return; b.innerHTML = d.map(m => `<div class="${m.mine ? 'text-right text-cyan-300' : 'text-zinc-200'}">${esc(m.msg)}</div>`).join(''); b.scrollTop = b.scrollHeight }
async function dmSend() { const i = $('dmin'), m = i.value.trim(); if (!m) return; sfx.click(); const d = await call('dm_send', { to_user: dmWith, m }); if (d) { i.value = ''; loadDm() } }

/* ---- Schach, Duelle & Mini-Games ---- */
VIEWS.duel = () => `<div class="glass rounded-xl p-4 mb-3"><b>⚔️ Duell erstellen</b><div class="flex gap-2 mt-2"><select id="dgame" class="inp py-2"><option value="coinflip">🪙 Coinflip</option><option value="dice">🎲 Dice</option></select><input id="dbet" type="number" min="10" value="100" class="inp flex-1 min-w-0"><button class="btn bg-pink-600" style="width:auto" onclick="duelCreate()">Erstellen</button></div></div><div id="dlist"></div>`
PAGEINIT.duel = () => { loadDuels(); pvpTimer = setInterval(loadDuels, 4000) }
async function loadDuels() { const d = await call('duel_list', {}); if (!d || !$('dlist')) return; $('dlist').innerHTML = d.open.map(x => `<div class="glass rounded-lg px-3 py-2 mb-1 flex justify-between items-center text-sm"><span>${nm(x)} · ${x.game} · <b class="text-yellow-400">${x.bet} FC</b></span>${x.mine ? `<button class="btn bg-red-900/80 hover:bg-red-800 text-red-200 border border-red-700/60" style="width:auto;padding:.2rem .6rem;font-size:0.75rem" onclick="duelCancel(${x.id})">↩ Zurückziehen</button>` : `<button class="btn bg-pink-600" style="width:auto;padding:.2rem .6rem" onclick="duelAct('duel_accept',${x.id})">Annehmen</button>`}</div>`).join('') || '<div class="text-zinc-500 text-sm">Keine offenen Duelle.</div>' }
async function duelCancel(id) {
  sfx.click()
  const d = await call('duel_cancel', { did: id })
  if (d) {
    toast('✔ Duell zurückgezogen und Einsatz erstattet!')
    setBalance(d.balance)
    loadDuels()
  }
}
async function duelCreate() { sfx.bet(); const d = await call('duel_create', { dgame: $('dgame').value, b: Math.floor(+$('dbet').value) }); if (d) { setBalance(d.balance); toast('⚔️ Duell erstellt'); loadDuels() } }
async function duelAct(fn, id) { sfx.click(); const d = await call(fn, { did: id }); if (!d) return; setBalance(d.balance); if (d.win) sfx.win(); else sfx.lose(); loadDuels() }

VIEWS.chess = () => '<div id="chessbox" class="text-zinc-400">Lade...</div>'
PAGEINIT.chess = () => chessLobby()
async function chessLobby() {
  const d = await call('chess_lobby', {}); if (!d || !$('chessbox')) return
  $('chessbox').innerHTML = `<div class="glass rounded-xl p-4 mb-3 flex justify-between items-center"><div><b>♟️ Elo: ${d.me.elo}</b></div><button class="btn bg-emerald-600" style="width:auto" onclick="chessNew()">Neue Partie</button></div>` + (d.open.map(g => `<div class="glass rounded-lg px-3 py-2 mb-1 flex justify-between items-center text-sm"><span>${nm(g)}</span><button class="btn bg-cyan-700" style="width:auto;padding:.2rem .6rem" onclick="chessJoin(${g.id})">Annehmen</button></div>`).join('') || '<div class="text-zinc-500 text-sm">Keine Partien offen.</div>')
}
async function chessNew() { sfx.click(); const d = await call('chess_create', {}); if (d) toast('Partie erstellt!') }
async function chessJoin(id) { sfx.click(); const d = await call('chess_join', { gid: id }); if (d) toast('Beigetreten!') }

/* ---- Future Games (Snake, Typing, Trivia, Tetris) ---- */
VIEWS.snake = () => `<div id="cbar"></div><canvas id="snk" width="300" height="300" class="mx-auto rounded-xl bg-zinc-900 border border-zinc-700 block"></canvas><div class="text-center my-3"><b>Punkte: <span id="snkscore">0</span></b></div><button class="btn bg-emerald-600" onclick="snakeStart()">Start</button><div id="lbox" class="mt-4"></div>`
PAGEINIT.snake = () => FG('snake')
let snk = null
function stopSnake() { if (snk) { clearInterval(snk.timer); document.removeEventListener('keydown', snk.key); snk = null } }
function snakeStart() {
  sfx.click(); stopSnake(); const c = $('snk'), x = c.getContext('2d'), N = 15, S = 20; $('snkscore').textContent = 0
  snk = { body: [[7, 7], [6, 7]], dir: [1, 0], nd: [1, 0], food: [10, 7], score: 0 }
  const place = () => { do { snk.food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)] } while (snk.body.some(b => b[0] === snk.food[0] && b[1] === snk.food[1])) }
  snk.key = e => { const m = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key]; if (m) snk.nd = m }
  document.addEventListener('keydown', snk.key)
  snk.timer = setInterval(() => {
    snk.dir = snk.nd; const h = [snk.body[0][0] + snk.dir[0], snk.body[0][1] + snk.dir[1]]
    if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || snk.body.some(b => b[0] === h[0] && b[1] === h[1])) { const sc = snk.score; stopSnake(); sfx.lose(); toast('💥 Game Over: ' + sc); return submitScore('snake', sc) }
    snk.body.unshift(h)
    if (h[0] === snk.food[0] && h[1] === snk.food[1]) { sfx.claim(); snk.score++; $('snkscore').textContent = snk.score; place() } else snk.body.pop()
    x.fillStyle = '#18181b'; x.fillRect(0, 0, 300, 300); x.fillStyle = '#f43f5e'; x.fillRect(snk.food[0] * S + 2, snk.food[1] * S + 2, S - 4, S - 4)
    x.fillStyle = '#34d399'; snk.body.forEach(b => x.fillRect(b[0] * S + 1, b[1] * S + 1, S - 2, S - 2))
  }, 110)
}

VIEWS.typing = () => `<div id="cbar"></div><div id="tprompt" class="glass rounded-xl p-4 mb-3 text-lg leading-relaxed">Drücke Start und tippe den Text so schnell du kannst.</div><input id="tin" class="inp w-full mb-3" disabled oninput="typingInput()"><button class="btn bg-emerald-600" onclick="typingStart()">Start</button><div id="lbox" class="mt-4"></div>`
PAGEINIT.typing = () => FG('typing')
const TTEXT = ['Die schnelle braune Katze springt über den faulen Hund und läuft weiter durch den dunklen Wald', 'Wer zuletzt lacht lacht am besten aber wer zuerst tippt gewinnt am Ende das Rennen']
let ty = null
function typingRender(v) { $('tprompt').innerHTML = [...ty.t].map((c, k) => `<span style="color:${k >= v.length ? '#a1a1aa' : v[k] === c ? '#34d399' : '#f87171'}">${c}</span>`).join('') }
function typingStart() { sfx.click(); ty = { t: TTEXT[Math.floor(Math.random() * TTEXT.length)], t0: 0 }; const i = $('tin'); i.value = ''; i.disabled = false; i.focus(); typingRender('') }
function typingInput() { if (!ty) return; const v = $('tin').value; if (!ty.t0) ty.t0 = Date.now(); sfx.click(); typingRender(v); if (v === ty.t) { const wpm = Math.min(220, Math.round(ty.t.length / 5 / ((Date.now() - ty.t0) / 60000))); $('tin').disabled = true; $('tprompt').innerHTML += `<div class="mt-3 text-xl font-black text-emerald-400">${wpm} WPM</div>`; ty = null; sfx.win(); submitScore('typing', wpm) } }

VIEWS.trivia = () => `<div id="cbar"></div><div id="tvbox" class="glass rounded-xl p-5 mb-3 text-center"><button class="btn bg-emerald-600" onclick="triviaStart()">10 Fragen starten</button></div><div id="lbox"></div>`
PAGEINIT.trivia = () => FG('trivia')
const QS = [['Hauptstadt von Australien?', ['Sydney', 'Canberra', 'Melbourne', 'Perth'], 1], ['Wie viele Planeten hat unser Sonnensystem?', ['7', '8', '9', '10'], 1], ['Welches Element hat das Symbol Au?', ['Silber', 'Gold', 'Argon'], 1], ['Was ist 7 × 8?', ['54', '56', '58'], 1]]
let tv = null
function triviaStart() { sfx.click(); tv = { q: [...QS], i: 0, s: 0 }; triviaShow() }
function triviaShow() { const [q, o] = tv.q[tv.i]; $('tvbox').innerHTML = `<div class="text-xs text-zinc-400 mb-2">Frage ${tv.i + 1}/${tv.q.length} · ${tv.s} Punkte</div><div class="text-lg font-bold mb-4">${q}</div>` + o.map((t, k) => `<button class="btn bg-zinc-800 mb-2" onclick="triviaAnswer(${k})">${t}</button>`).join('') }
function triviaAnswer(k) { const [, o, c] = tv.q[tv.i]; if (k === c) { tv.s++; sfx.win() } else sfx.lose(); tv.i++; if (tv.i < tv.q.length) return triviaShow(); const sc = tv.s; tv = null; $('tvbox').innerHTML = `<div class="text-4xl font-black mb-3">${sc} Punkte 🎉</div><button class="btn bg-emerald-600" onclick="triviaStart()">Nochmal</button>`; submitScore('trivia', sc) }

VIEWS.tetris = () => `<div id="cbar"></div><canvas id="ttc" width="200" height="400" class="mx-auto rounded-xl bg-zinc-900 border border-zinc-700 block"></canvas><div class="text-center my-2"><b>Punkte: <span id="ttscore">0</span></b></div><button class="btn bg-emerald-600" onclick="tetrisStart()">Start</button><div id="lbox" class="mt-4"></div>`
PAGEINIT.tetris = () => FG('tetris')
let tt = null
function stopTetris() { if (tt) { clearInterval(tt.timer); document.removeEventListener('keydown', tt.key); tt = null } }
function tetrisStart() { sfx.click(); stopTetris(); tt = { score: 0 }; $('ttscore').textContent = 0; toast('Tetris läuft! Pfeiltasten zum Steuern.') }

async function submitScore(game, sc) { const d = await call('submit_score', { sgame: game, sc }); if (d && d.reward) { sfx.claim(); setBalance(d.balance); toast('🎯 +' + d.reward + ' FC') } }
async function loadScores(g) { const d = await call('scores_top', { sgame: g }), b = $('lbox'); if (d && b) b.innerHTML = '<div class="font-bold mb-2">🏆 Bestenliste</div>' + d.map((x, i) => `<div class="flex justify-between glass rounded-lg px-3 py-2 mb-1 text-sm"><span>${i + 1}. ${nm(x)}</span><b>${x.best}</b></div>`).join('') }
function FG(g) { loadScores(g) }

function renderHist() {
  $('hist').innerHTML = HIST.length ? '<div class="text-xs text-zinc-500 mb-1">Letzte Spiele</div>' + HIST.map(h => `<div class="glass rounded-lg px-3 py-2 flex justify-between"><span>${h.g}</span><span class="text-zinc-400">${h.bet} FC</span><b class="${h.net > 0 ? 'text-emerald-400' : h.net < 0 ? 'text-red-400' : 'text-zinc-400'}">${h.net > 0 ? '+' : ''}${h.net}</b></div>`).join('') : ''
}
async function delMe() { if (!confirm('Account endgültig löschen?') || !confirm('Wirklich sicher?')) return; const { error } = await sb.rpc('delete_me'); if (error) return toast(error.message); logout() }
async function loadMissions() { const d = await call('missions_list', {}); if (d && $('missions')) $('missions').innerHTML = '<div class="font-bold mb-2">📋 Tagesmissionen</div>' + d.map(m => `<div class="glass rounded-xl p-3 mb-2 flex justify-between text-sm"><span>${m.label}</span><b class="text-yellow-400">+${m.reward} FC</b></div>`).join('') }
// Level system completely removed }
async function tournamentHtml() { const t = await call('tournament_board', {}); if (!t) return ''; return `<div class="glass rounded-xl p-4 mb-2"><div class="font-bold">🏆 Wochenturnier</div><div class="text-xs text-zinc-400">1. Platz: 5.000 FC</div></div>` }
async function admRain() { const t = Number(prompt('Gesamtsumme für alle Spieler (FC):')); if (t > 0) { const d = await call('admin_rain', { total: t }); if (d) toast('🌧️ ' + d.each + ' FC an ' + d.count + ' Spieler') } }
async function admPayWeek() { const d = await call('admin_pay_week', {}); if (d) toast('🏆 Gewinner bezahlt') }

/* ---------- Auth ---------- */
const fakeEmail = u => u.toLowerCase().replace(/[^a-z0-9]/g, '') + '@future.community'
$('registerBtn').addEventListener('click', async () => {
  sfx.click()
  setStatus('Registrierung läuft...')
  const username = $('username').value.trim(), password = $('password').value
  if (username.length < 3) return setStatus('Username muss min. 3 Zeichen haben', 'error')
  if (password.length < 6) return setStatus('Passwort muss min. 6 Zeichen haben', 'error')
  const { error } = await sb.auth.signUp({ email: fakeEmail(username), password, options: { data: { username } } })
  if (error) { sfx.lose(); setStatus('Fehler: ' + error.message, 'error') } else { sfx.claim(); setStatus('Account erstellt! Jetzt einloggen.', 'success') }
})
$('loginBtn').addEventListener('click', async () => {
  sfx.click()
  setStatus('Login läuft...')
  const username = $('username').value.trim(), password = $('password').value
  if (!username || !password) return setStatus('Bitte Username und Passwort eingeben', 'error')
  const { error } = await sb.auth.signInWithPassword({ email: fakeEmail(username), password })
  if (error) { sfx.lose(); setStatus('Login fehlgeschlagen: ' + error.message, 'error') }
})
async function logout() { sfx.click(); await sb.auth.signOut(); location.reload() }

sb.auth.onAuthStateChange((event, session) => {
  if (!session) return
  $('auth-screen').style.display = 'none'
  $('app').classList.remove('hidden')
  setTimeout(() => { if (!$('view').innerHTML) show(current); loadProfile() }, 0)
})
</script>
