function setStatus(text, type = 'info') {
  const el = $('status'); el.textContent = text
  el.style.background = type === 'error' ? 'rgba(127,29,29,.5)' : type === 'success' ? 'rgba(6,78,59,.5)' : '#27272a'
  el.style.color = type === 'error' ? '#fca5a5' : type === 'success' ? '#6ee7b7' : '#d4d4d8'

async function play(param) {
  if (busy) return
  const bet = Math.floor(Number($('bet').value))
  if (!(bet >= 1)) return msg('Ungültiger Einsatz', 'lose')
  if (bet > balance) return msg('Nicht genug Coins', 'lose')
  sfx.bet()
  busy = true; lastBet = bet; lastParam = param; setBtns(true); msg('')
  const { data, error } = current === 'plinko' ? await sb.rpc('play_plinko', { bet_amount: bet, risk: plinkoRisk }) : await sb.rpc(current === 'baccarat' || current === 'sicbo' ? 'play_game2' : 'play_game_d', { game_name: current, bet_amount: bet, param })
  if (error) { msg(error.message, 'lose'); sfx.lose(); busy = false; setBtns(false); return }
  if (REVEAL[current]) await REVEAL[current](data)
  setBalance(data.balance)
  const net = data.payout - bet
  if (net > 0) sfx.win(); else if (net < 0) sfx.lose(); else sfx.click()
  msg(net > 0 ? `🎉 +${net.toLocaleString('de-DE')} FC` : net === 0 ? 'Einsatz zurück' : `−${bet - data.payout} FC`, net > 0 ? 'win' : 'lose')
  HIST.unshift({ g: GAMES[current].icon + ' ' + GAMES[current].name, bet, net }); HIST.length = Math.min(HIST.length, 8); renderHist()
  busy = false; setBtns(false)
}

  sfx.click(); stopSnake(); const c = $('snk'), x = c.getContext('2d'), N = 15, S = 20; $('snkscore').textContent = 0
  snk = { body: [[7, 7], [6, 7]], dir: [1, 0], nd: [1, 0], food: [10, 7], score: 0 }
  const place = () => { do { snk.food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)] } while (snk.body.some(b => b[0] === snk.food[0] && b[1] === snk.food[1])) }
  snk.key = e => { const m = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key]; if (m) snk.nd = m }
  document.addEventListener('keydown', snk.key)
  snk.timer = setInterval(() => {
    snk.dir = snk.nd; const h = [snk.body[0][0] + snk.dir[0], snk.body[0][1] + snk.dir[1]]
    if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || snk.body.some(b => b[0] === h[0] && b[1] === h[1])) { const sc = snk.score; stopSnake(); sfx.lose(); toast('💥 Game Over: ' + sc); return submitScore('snake', sc) }
    snk.body.unshift(h)
    if (h[0] === snk.food[0] && h[1] === snk.food[1]) { sfx.claim(); snk.score++; $('snkscore').textContent = snk.score; place() } else snk.body.pop()
    x.fillStyle = '#18181b'; x.fillRect(0, 0, 300, 300); x.fillStyle = '#f43f5e'; x.fillRect(snk.food[0] * S + 2, snk.food[1] * S + 2, S - 4, S - 4)
    x.fillStyle = '#34d399'; snk.body.forEach(b => x.fillRect(b[0] * S + 1, b[1] * S + 1, S - 2, S - 2))
  }, 110)
}

VIEWS.typing = () => `<div id="cbar"></div><div id="tprompt" class="glass rounded-xl p-4 mb-3 text-lg leading-relaxed">Drücke Start und tippe den Text so schnell du kannst.</div><input id="tin" class="inp w-full mb-3" disabled oninput="typingInput()"><button class="btn bg-emerald-600" onclick="typingStart()">Start</button><div id="lbox" class="mt-4"></div>`
PAGEINIT.typing = () => FG('typing')
const TTEXT = ['Die schnelle braune Katze springt über den faulen Hund und läuft weiter durch den dunklen Wald', 'Wer zuletzt lacht lacht am besten aber wer zuerst tippt gewinnt am Ende das Rennen']
let ty = null
function typingRender(v) { $('tprompt').innerHTML = [...ty.t].map((c, k) => `<span style="color:${k >= v.length ? '#a1a1aa' : v[k] === c ? '#34d399' : '#f87171'}">${c}</span>`).join('') }
function typingStart() { sfx.click(); ty = { t: TTEXT[Math.floor(Math.random() * TTEXT.length)], t0: 0 }; const i = $('tin'); i.value = ''; i.disabled = false; i.focus(); typingRender('') }
function typingInput() { if (!ty) return; const v = $('tin').value; if (!ty.t0) ty.t0 = Date.now(); sfx.click(); typingRender(v); if (v === ty.t) { const wpm = Math.min(220, Math.round(ty.t.length / 5 / ((Date.now() - ty.t0) / 60000))); $('tin').disabled = true; $('tprompt').innerHTML += `<div class="mt-3 text-xl font-black text-emerald-400">${wpm} WPM</div>`; ty = null; sfx.win(); submitScore('typing', wpm) } }

VIEWS.trivia = () => `<div id="cbar"></div><div id="tvbox" class="glass rounded-xl p-5 mb-3 text-center"><button class="btn bg-emerald-600" onclick="triviaStart()">10 Fragen starten</button></div><div id="lbox"></div>`
PAGEINIT.trivia = () => FG('trivia')
const QS = [['Hauptstadt von Australien?', ['Sydney', 'Canberra', 'Melbourne', 'Perth'], 1], ['Wie viele Planeten hat unser Sonnensystem?', ['7', '8', '9', '10'], 1], ['Welches Element hat das Symbol Au?', ['Silber', 'Gold', 'Argon'], 1], ['Was ist 7 × 8?', ['54', '56', '58'], 1]]
let tv = null
function triviaStart() { sfx.click(); tv = { q: [...QS], i: 0, s: 0 }; triviaShow() }
function triviaShow() { const [q, o] = tv.q[tv.i]; $('tvbox').innerHTML = `<div class="text-xs text-zinc-400 mb-2">Frage ${tv.i + 1}/${tv.q.length} · ${tv.s} Punkte</div><div class="text-lg font-bold mb-4">${q}</div>` + o.map((t, k) => `<button class="btn bg-zinc-800 mb-2" onclick="triviaAnswer(${k})">${t}</button>`).join('') }
function triviaAnswer(k) { const [, o, c] = tv.q[tv.i]; if (k === c) { tv.s++; sfx.win() } else sfx.lose(); tv.i++; if (tv.i < tv.q.length) return triviaShow(); const sc = tv.s; tv = null; $('tvbox').innerHTML = `<div class="text-4xl font-black mb-3">${sc} Punkte 🎉</div><button class="btn bg-emerald-600" onclick="triviaStart()">Nochmal</button>`; submitScore('trivia', sc) }

VIEWS.tetris = () => `<div id="cbar"></div><canvas id="ttc" width="200" height="400" class="mx-auto rounded-xl bg-zinc-900 border border-zinc-700 block"></canvas><div class="text-center my-2"><b>Punkte: <span id="ttscore">0</span></b></div><button class="btn bg-emerald-600" onclick="tetrisStart()">Start</button><div id="lbox" class="mt-4"></div>`
PAGEINIT.tetris = () => FG('tetris')
let tt = null
function stopTetris() { if (tt) { clearInterval(tt.timer); document.removeEventListener('keydown', tt.key); tt = null } }
function tetrisStart() { sfx.click(); stopTetris(); tt = { score: 0 }; $('ttscore').textContent = 0; toast('Tetris läuft! Pfeiltasten zum Steuern.') }

async function submitScore(game, sc) { const d = await call('submit_score', { sgame: game, sc }); if (d && d.reward) { sfx.claim(); setBalance(d.balance); toast('🎯 +' + d.reward + ' FC') } }
async function loadScores(g) { const d = await call('scores_top', { sgame: g }), b = $('lbox'); if (d && b) b.innerHTML = '<div class="font-bold mb-2">🏆 Bestenliste</div>' + d.map((x, i) => `<div class="flex justify-between glass rounded-lg px-3 py-2 mb-1 text-sm"><span>${i + 1}. ${nm(x)}</span><b>${x.best}</b></div>`).join('') }
function FG(g) { loadScores(g) }

function renderHist() {
  $('hist').innerHTML = HIST.length ? '<div class="text-xs text-zinc-500 mb-1">Letzte Spiele</div>' + HIST.map(h => `<div class="glass rounded-lg px-3 py-2 flex justify-between"><span>${h.g}</span><span class="text-zinc-400">${h.bet} FC</span><b class="${h.net > 0 ? 'text-emerald-400' : h.net < 0 ? 'text-red-400' : 'text-zinc-400'}">${h.net > 0 ? '+' : ''}${h.net}</b></div>`).join('') : ''
}
async function delMe() { if (!confirm('Account endgültig löschen?') || !confirm('Wirklich sicher?')) return; const { error } = await sb.rpc('delete_me'); if (error) return toast(error.message); logout() }
async function loadMissions() { const d = await call('missions_list', {}); if (d && $('missions')) $('missions').innerHTML = '<div class="font-bold mb-2">📋 Tagesmissionen</div>' + d.map(m => `<div class="glass rounded-xl p-3 mb-2 flex justify-between text-sm"><span>${m.label}</span><b class="text-yellow-400">+${m.reward} FC</b></div>`).join('') }
async function loadLevel() { const d = await call('level_info', {}); if (d && $('lvlbox')) $('lvlbox').innerHTML = `<div class="glass rounded-xl p-3 flex justify-between items-center"><div><b>⭐ Level ${d.level}</b></div>${d.reward > 0 ? `<button class="btn bg-yellow-500 text-black text-xs" style="width:auto" onclick="claimLevel()">+${d.reward} FC</button>` : ''}</div>` }
async function claimLevel() { const d = await call('level_claim', {}); if (d) { sfx.claim(); setBalance(d.balance); toast('⭐ +' + d.reward + ' FC'); loadLevel() } }
async function tournamentHtml() { const t = await call('tournament_board', {}); if (!t) return ''; return `<div class="glass rounded-xl p-4 mb-2"><div class="font-bold">🏆 Wochenturnier</div><div class="text-xs text-zinc-400">1. Platz: 5.000 FC</div></div>` }
async function admRain() { const t = Number(prompt('Gesamtsumme für alle Spieler (FC):')); if (t > 0) { const d = await call('admin_rain', { total: t }); if (d) toast('🌧️ ' + d.each + ' FC an ' + d.count + ' Spieler') } }
async function admPayWeek() { const d = await call('admin_pay_week', {}); if (d) toast('🏆 Gewinner bezahlt') }

/* ---------- Auth ---------- */
const fakeEmail = u => u.toLowerCase().replace(/[^a-z0-9]/g, '') + '@future.community'
$('registerBtn').addEventListener('click', async () => {
  sfx.click()
  setStatus('Registrierung läuft...')
  const username = $('username').value.trim(), password = $('password').value
  if (username.length < 3) return setStatus('Username muss min. 3 Zeichen haben', 'error')
  if (password.length < 6) return setStatus('Passwort muss min. 6 Zeichen haben', 'error')
  const { error } = await sb.auth.signUp({ email: fakeEmail(username), password, options: { data: { username } } })
  if (error) { sfx.lose(); setStatus('Fehler: ' + error.message, 'error') } else { sfx.claim(); setStatus('Account erstellt! Jetzt einloggen.', 'success') }
})
$('loginBtn').addEventListener('click', async () => {
  sfx.click()
  setStatus('Login läuft...')
  const username = $('username').value.trim(), password = $('password').value
  if (!username || !password) return setStatus('Bitte Username und Passwort eingeben', 'error')
  const { error } = await sb.auth.signInWithPassword({ email: fakeEmail(username), password })
  if (error) { sfx.lose(); setStatus('Login fehlgeschlagen: ' + error.message, 'error') }
})
async function logout() { sfx.click(); await sb.auth.signOut(); location.reload() }

sb.auth.onAuthStateChange((event, session) => {
  if (!session) return
  $('auth-screen').style.display = 'none'
  $('app').classList.remove('hidden')
  setTimeout(() => { if (!$('view').innerHTML) show(current); loadProfile() }, 0)
})
</script>
